<style>
    .nav-link-active {
        color: #0c0a09 !important;
        background: linear-gradient(135deg, #d6bc8c 0%, #f6e3c5 50%, #d6bc8c 100%);
        background-size: 200% auto;
        border: 1px solid rgba(214, 188, 140, 0.6);
        border-radius: 9999px;
        padding: 6px 16px !important;
        margin: -6px -8px;
        box-shadow: 0 4px 20px -3px rgba(214, 188, 140, 0.5);
        position: relative;
        overflow: hidden;
        display: inline-block;
        font-weight: 600 !important;
        letter-spacing: 0.15em !important;
        transition: all 0.3s ease;
    }
    
    /* Brushed metallic reflection shine sweep overlay */
    .nav-link-active::after {
        content: '';
        position: absolute;
        top: -50%;
        left: -100%;
        width: 50%;
        height: 200%;
        background: linear-gradient(
            to right,
            rgba(255, 255, 255, 0) 0%,
            rgba(255, 255, 255, 0.65) 50%,
            rgba(255, 255, 255, 0) 100%
        );
        transform: rotate(30deg);
        animation: shineSweep 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    @keyframes shineSweep {
        0% { left: -100%; }
        25% { left: 150%; }
        100% { left: 150%; }
    }
</style>
<script>
    document.addEventListener("DOMContentLoaded", () => {
        const path = window.location.pathname;
        const currentPath = path.split("/").pop() || "index.html";
        const navLinks = document.querySelectorAll('#navbar nav a, #mobile-menu nav a');
        
        navLinks.forEach(link => {
            const href = link.getAttribute('href');
            if (!href) return;
            
            // Normalize path matching
            const hrefFilename = href.split('/').pop();
            const isMatch = (hrefFilename === currentPath) ||
                            (path.includes('/autores/') && hrefFilename === 'autores.html') ||
                            (path.includes('/livros/') && hrefFilename === 'livros.html');
                            
            if (isMatch) {
                link.classList.add('nav-link-active');
            }
        });
    });
</script>
