<style>
    /* Active Link State on Desktop */

        color: #0c0a09 !important;
        background: linear-gradient(135deg, #d6bc8c 0%, #f6e3c5 50%, #d6bc8c 100%);
        background-size: 200% auto;

        border-radius: 9999px;
        padding: 6px 18px !important;
        margin: -6px -4px;
        box-shadow: 0 4px 20px -3px rgba(214, 188, 140, 0.5);
        position: relative;
        overflow: hidden;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-weight: 600 !important;
        letter-spacing: 0.15em !important;
        transition: all 0.3s ease;
    }
    
    /* Brushed metallic reflection shine sweep overlay */
    #navbar nav a.nav-link-active::after {
        content: '';
        position: absolute;
        top: -50%;
        left: -100%;
        width: 50%;
        height: 200%;
        background: linear-gradient(
            to right,
            rgba(255, 255, 255, 0) 0%,
            rgba(255, 255, 255, 0.65) 50%,
            rgba(255, 255, 255, 0) 100%
        );
        transform: rotate(30deg);
        animation: shineSweep 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    @keyframes shineSweep {
        0% { left: -100%; }
        25% { left: 150%; }
        100% { left: 150%; }
    }

    /* Active Link State in Mobile Drawer */
    #mobile-menu a.mobile-nav-link.nav-link-active {
        color: #0c0a09 !important;
        background: linear-gradient(135deg, #d6bc8c 0%, #f6e3c5 50%, #d6bc8c 100%) !important;
        border: 1px solid rgba(214, 188, 140, 0.9) !important;
        border-radius: 16px !important;
        font-weight: 700 !important;
        box-shadow: 0 6px 25px -4px rgba(214, 188, 140, 0.6) !important;
    }
    #mobile-menu a.mobile-nav-link.nav-link-active iconify-icon {
        color: #0c0a09 !important;
        opacity: 1 !important;
    }
</style>

<script>
    (function() {
        function initNavigation() {
            // 1. Identify current active page
            const pathname = window.location.pathname;
            function cleanSlug(url) {
                if (!url) return 'index';
                const noQuery = url.split('?')[0].split('#')[0];
                const parts = noQuery.split('/').filter(Boolean);
                if (parts.length === 0) return 'index';
                const file = parts[parts.length - 1];
                return file.replace(/\.html$/, '') || 'index';
            }

            const currentSlug = cleanSlug(pathname);
            const isAuthorSubpage = pathname.includes('/autores/');
            const isBookSubpage = pathname.includes('/livros/');

            const allLinks = document.querySelectorAll('#navbar nav a, #mobile-menu nav a');
            allLinks.forEach(link => {
                const href = link.getAttribute('href');
                if (!href) return;
                const linkSlug = cleanSlug(href);

                let isMatch = false;
                if (currentSlug === 'index' && linkSlug === 'index') {
                    isMatch = true;
                } else if (currentSlug !== 'index' && linkSlug === currentSlug) {
                    isMatch = true;
                } else if (isAuthorSubpage && linkSlug === 'autores') {
                    isMatch = true;
                } else if (isBookSubpage && linkSlug === 'livros') {
                    isMatch = true;
                }

                if (isMatch) {
                    link.classList.add('nav-link-active');
                    link.setAttribute('aria-current', 'page');
                }
            });

            // 2. Mobile Menu Toggle Logic
            const menuBtn = document.getElementById('mobile-menu-btn');
            const menuClose = document.getElementById('mobile-menu-close');
            const mobileMenu = document.getElementById('mobile-menu');

            function openMenu() {
                if (!mobileMenu) return;
                mobileMenu.classList.remove('opacity-0', 'pointer-events-none');
                mobileMenu.classList.add('opacity-100', 'pointer-events-auto');
                document.body.style.overflow = 'hidden';
            }

            function closeMenu() {
                if (!mobileMenu) return;
                mobileMenu.classList.add('opacity-0', 'pointer-events-none');
                mobileMenu.classList.remove('opacity-100', 'pointer-events-auto');
                document.body.style.overflow = '';
            }

            if (menuBtn) {
                menuBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    const isOpen = mobileMenu && mobileMenu.classList.contains('opacity-100');
                    if (isOpen) closeMenu();
                    else openMenu();
                });
            }

            if (menuClose) {
                menuClose.addEventListener('click', (e) => {
                    e.preventDefault();
                    closeMenu();
                });
            }

            if (mobileMenu) {
                // Close when tapping any link inside
                mobileMenu.querySelectorAll('.mobile-link').forEach(link => {
                    link.addEventListener('click', () => {
                        closeMenu();
                    });
                });

                // Close when pressing Escape key
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') closeMenu();
                });
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initNavigation);
        } else {
            initNavigation();
        }
    })();
</script>
